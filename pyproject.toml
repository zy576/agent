[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeloop-agent"
version = "0.1.0"
description = "A small coding agent built directly on native model tool calling."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ForgeLoop Contributors"}]
dependencies = []

[project.scripts]
forgeloop = "forgeloop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forgeloop = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]
